<!DOCTYPE html>
<html lang="it">
<head>
    <style>
        /* ... tutto il tuo CSS originale (righe 1-~450) ... */

        /* AGGIUNTA: STILE PER I GIOCHI SCRATCH */
        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; padding: 20px; }
        .game-card { background: #fff; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.2s; border: 2px solid #e2e8f0; text-align: center; }
        .game-card:hover { transform: translateY(-5px); border-color: #2563c0; }
        .game-thumb { width: 100%; height: 120px; background: #0f2d5c; display: flex; align-items: center; justify-content: center; font-size: 40px; }
        .game-title { padding: 10px; font-weight: 800; color: #1a4d8f; font-size: 14px; }
        .modal-full { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; flex-direction: column; z-index: 10000; padding: 20px; }
        .modal-header { display: flex; justify-content: space-between; color: #fff; align-items: center; margin-bottom: 15px; }
        .close-game { background: #ef4444; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="fm-topbar">
        <span class="fm-brand" onclick="goTo('sc-home')">🖥️ Nicolascassese.it 🏠</span>
        <div style="flex:1"></div>
        <button class="tbtn tbtn-blue" id="btn-nuovo-top" onclick="showNewDialog()" style="display:none; margin-right:10px">➕ Nuovo</button>
        
        <button class="tbtn tbtn-blue" onclick="openGames()" style="background:#059669; margin-right:10px">🎮 I miei giochi</button>
        
        <div class="avatar-wrap" id="avatar-wrap" onclick="toggleAvatarMenu()">
            </div>
    </div>

    <div id="games-modal" class="modal-full">
        <div class="modal-header">
            <h2 id="modal-title" style="font-family:'Nunito'">I Miei Giochi Scratch</h2>
            <button class="close-game" onclick="closeGames()">❌ Chiudi</button>
        </div>
        <div id="games-content" style="height: 100%; overflow-y: auto;"></div>
    </div>

    <script>
        /* ... tutto il tuo JavaScript originale (righe 1-982) ... */
        /* NON CANCELLARE NULLA DELLE TUE FUNZIONI saveFs, loadUsers, etc. */

        // AGGIUNTA ALLA FINE DEL TUO SCRIPT:
        const myGames = [
            { id: '1106495237', title: 'Labirinto' },
            { id: '1029670413', title: 'Space War' },
            { id: '1029672290', title: 'Super Pong' },
            { id: '1149996939', title: 'Adventure' },
            { id: '1136611287', title: 'Clicker Pro' }
        ];

        function openGames() {
            const modal = document.getElementById('games-modal');
            const content = document.getElementById('games-content');
            modal.style.display = 'flex';
            document.getElementById('modal-title').innerText = "🎮 I Miei Giochi Scratch";
            
            let html = `<div class="games-grid">`;
            myGames.forEach(g => {
                html += `
                    <div class="game-card" onclick="playGame('${g.id}', '${g.title}')">
                        <div class="game-thumb">🕹️</div>
                        <div class="game-title">${g.title}</div>
                    </div>`;
            });
            html += `</div>`;
            content.innerHTML = html;
        }

        function playGame(id, title) {
            const content = document.getElementById('games-content');
            document.getElementById('modal-title').innerText = "Giocando a: " + title;
            content.innerHTML = `
                <button class="tbtn tbtn-blue" style="margin-bottom:10px" onclick="openGames()">⬅️ Torna alla lista</button>
                <iframe src="https://scratch.mit.edu/projects/${id}/embed" allowtransparency="true" width="100%" height="85%" frameborder="0" scrolling="no" allowfullscreen></iframe>
            `;
        }

        function closeGames() {
            document.getElementById('games-modal').style.display = 'none';
        }
    </script>
</body>
</html>
